# Local, disposable benchmark configuration. Do not use it for production.
spring.datasource.url=jdbc:h2:mem:verdixa_benchmark;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.minimum-idle=4
server.tomcat.threads.max=64
server.tomcat.accept-count=100
algosphere.jwt.secret=benchmark-only-secret-that-is-at-least-32-characters
algosphere.benchmark.seed=true
