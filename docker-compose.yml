services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-leetcode_platform}
      MYSQL_USER: ${MYSQL_USER:-algosphere}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-algosphere_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root_dev_only}"]
      interval: 10s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    environment:
      ALGOSPHERE_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-leetcode_platform}
      ALGOSPHERE_DB_USERNAME: ${MYSQL_USER:-algosphere}
      ALGOSPHERE_DB_PASSWORD: ${MYSQL_PASSWORD:-algosphere_dev}
      ALGOSPHERE_JWT_SECRET: ${ALGOSPHERE_JWT_SECRET:?Set ALGOSPHERE_JWT_SECRET in .env}
      VERDIXA_PUBLIC_BASE_URL: ${VERDIXA_PUBLIC_BASE_URL:-http://localhost:5173}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-disabled}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-disabled}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-disabled}
      OAUTH2_FRONTEND_SUCCESS_URL: ${OAUTH2_FRONTEND_SUCCESS_URL:-http://localhost:5173/oauth/callback}
      OAUTH2_FRONTEND_FAILURE_URL: ${OAUTH2_FRONTEND_FAILURE_URL:-http://localhost:5173/oauth/error}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-UTC}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Verdixa}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_TEST_CONNECTION: ${MAIL_TEST_CONNECTION:-false}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ALGOSPHERE_CPP_COMMAND: g++
      ALGOSPHERE_RUNTIME_PATH: ""
      ALGOSPHERE_PYTHON_COMMAND: python3
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
volumes:
  mysql_data:
