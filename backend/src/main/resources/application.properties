spring.application.name=LeetCodePlatform

spring.datasource.url=${ALGOSPHERE_DB_URL:jdbc:mysql://localhost:3306/leetcode_platform}
spring.datasource.username=${ALGOSPHERE_DB_USERNAME:root}
spring.datasource.password=${ALGOSPHERE_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

algosphere.execution.javac=${ALGOSPHERE_JAVAC_COMMAND:javac}
algosphere.execution.java=${ALGOSPHERE_JAVA_COMMAND:java}
algosphere.execution.gxx=${ALGOSPHERE_CPP_COMMAND:C:\\msys64\\ucrt64\\bin\\g++.exe}
algosphere.execution.python=${ALGOSPHERE_PYTHON_COMMAND:python}
algosphere.execution.runtime-path=${ALGOSPHERE_RUNTIME_PATH:C:\\msys64\\ucrt64\\bin;C:\\msys64\\usr\\bin}
algosphere.jwt.secret=${ALGOSPHERE_JWT_SECRET:}
algosphere.bootstrap-admin.username=${ALGOSPHERE_BOOTSTRAP_ADMIN_USERNAME:}
algosphere.bootstrap-admin.password=${ALGOSPHERE_BOOTSTRAP_ADMIN_PASSWORD:}

# Canonical frontend origin printed on verified certificate PDFs.
verdixa.public-base-url=${VERDIXA_PUBLIC_BASE_URL:http://localhost:5173}
verdixa.frontend-base-url=${FRONTEND_BASE_URL:${VERDIXA_PUBLIC_BASE_URL:http://localhost:5173}}
verdixa.app-time-zone=${APP_TIME_ZONE:UTC}
verdixa.oauth.frontend-success-url=${OAUTH2_FRONTEND_SUCCESS_URL:${verdixa.frontend-base-url}/oauth/callback}
verdixa.oauth.frontend-failure-url=${OAUTH2_FRONTEND_FAILURE_URL:${verdixa.frontend-base-url}/oauth/error}

# OAuth client credentials remain server-only. Leave these empty to disable a provider locally.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# SMTP is opt-in locally. In production, set MAIL_ENABLED=true and provide a TLS-capable SMTP server.
verdixa.mail.enabled=${MAIL_ENABLED:false}
verdixa.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
verdixa.mail.from-name=${MAIL_FROM_NAME:Verdixa}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Set this to true in a deployed environment to validate SMTP authentication at startup.
spring.mail.test-connection=${MAIL_TEST_CONNECTION:false}

# Gemini stays server-side. Leave disabled locally until a deployment secret is configured.
verdixa.gemini.enabled=${GEMINI_ENABLED:false}
verdixa.gemini.api-key=${GEMINI_API_KEY:}
verdixa.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
